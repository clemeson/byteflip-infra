nameOverride: simplaca-api

# CI supplies repository and immutable commit SHA at deploy time.
image:
  repository: ""
  tag: ""

# Fonte unica da porta: o chart injeta PORT=containerPort no container, e a
# probe e o Service usam o mesmo numero. PORT nao deve estar no Key Vault.
containerPort: 4000
portEnvName: PORT

# The Dockerfile's default CMD runs migrations. Override it here so only
# the Helm pre-upgrade Job applies migrations once per release.
command: ["node", "dist/src/main.js"]

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  configMap:
    enabled: false
  secret:
    enabled: true
    name: simplaca-api-env

ingress:
  enabled: true
  host: api.simplaca.com.br
  ingressClassName: traefik
  clusterIssuer: letsencrypt-prod

migration:
  enabled: true
  command: ["npx", "prisma", "migrate", "deploy"]
