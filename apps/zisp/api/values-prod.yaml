# zisp-api (era `api-core` no Flux do zisp-k8s).
# API principal do ZISP: tenants, assinantes, cobranca, e a ponte com o
# zisp-vpn-api.
nameOverride: zisp-api

# CI supplies repository and immutable commit SHA at deploy time.
image:
  repository: ""
  tag: ""

containerPort: 3030
portEnvName: PORT

# NAO VERIFICADO: o repo zisp-api nao estava nesta maquina. Confira o CMD do
# Dockerfile dele antes do primeiro deploy e ajuste as duas coisas abaixo:
#   - o caminho (vpn-api usa dist/main.js, super-api usa dist/main);
#   - se o CMD ja roda migration, este override e obrigatorio, para que so o
#     Job de pre-upgrade aplique schema, uma vez por release. Se nao roda,
#     pode remover a linha e deixar o CMD da imagem valer.
command: ["node", "dist/main.js"]

# Unico dos tres que paga o surge de deploy: e o que tem tenant batendo o
# tempo todo. Custa ~576Mi a mais por ~40s no no.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

resources:
  requests:
    cpu: 250m
    memory: 320Mi
  limits:
    cpu: 900m
    memory: 576Mi

# Desligado de proposito. Com um pool de UM no, o HPA sobe replica que fica
# Pending: nao ha para onde escalar. Ligue junto com o segundo no.
autoscaling:
  enabled: false

probes:
  enabled: true
  path: /health
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Prende no pool `zisp`, junto do vpn-server. Nao e organizacao, e rota.
#
# O zisp-api fala com os Mikrotik em 10.19.24.0/22 pela API RouterOS. As
# interfaces ppp nascem no netns do NO que roda o vpn-server (hostNetwork), e
# a tabela de rotas com `10.19.25.x dev pppN` e a DESSE no. Este pod tem netns
# proprio; o que o faz alcancar o Mikrotik e a rota default do pod cair no
# host netns do no, que entao encaminha. De outro no nao existe rota para a
# faixa e o pacote morre no default gateway.
#
# Os dois juntos: so nodeSelector ficaria Pending no no taintado, so
# toleration deixaria o pod cair em qualquer no.
#
# Fica Pending enquanto `zisp_node_pool_enabled` for false. Isso e fail-safe:
# subir o zisp-api num no sem a rota daria timeout em toda chamada a Mikrotik,
# que e bem pior de diagnosticar que um pod Pending.
# ---------------------------------------------------------------------------
nodeSelector:
  byteflip.dev/workload: zisp
tolerations:
  - key: byteflip.dev/workload
    operator: Equal
    value: zisp
    effect: NoSchedule

env:
  # Nao-segredo fica aqui, versionado e revisavel em PR. Segredo fica no Key
  # Vault. Mudar uma linha deste bloco e um commit neste repo, que dispara o
  # deploy pelo caminho de push -- sem rebuild de imagem.
  configMap:
    enabled: true
    data:
      NODE_ENV: "production"
      DISABLE_OBSERVABILITY: "true"
      # DNS interno do cluster. O release do vpn-api chama-se zisp-vpn-api,
      # entao o Service e zisp-vpn-api-svc -- NAO api-vpn-svc, que era o nome
      # no Flux. Mesmo namespace, nome curto resolve.
      VPN_API_URL: "http://zisp-vpn-api-svc"
      # PREREQUISITO: os dois Redis ainda nao existem no cluster. Nomes
      # curtos porque ficam no MESMO namespace `zisp` -- nao ha mais
      # namespace `platform`, porque o Postgres saiu de cena (esta no
      # Supabase, ver DATABASE_URL abaixo) e so o ZISP usa estes Redis.
      REDIS_HOST: "redis-monitor-svc"
      REDIS_PORT: "6379"
      REDIS_CLOUD_URL: "redis://redis-bullmq-svc:6379"
      AWS_S3_BUCKET: "zisp-backups"
  secret:
    enabled: true
    # Conteudo: um JSON no Key Vault byteflipappsprod.
    #
    # DATABASE_URL precisa estar AQUI, nao no ConfigMap: o Job de migracao le
    # so o Secret, porque em pre-upgrade o ConfigMap do release ainda nao
    # existe.
    #
    # O banco esta VIVO no Supabase (projeto msiwosrcaemcocsammfl, sa-east-1):
    # 67 tabelas, 49 migrations aplicadas, nenhuma falhada, ultima em
    # 2026-09-14. Nao se perdeu com a VPS. Use o SESSION pooler, porta 5432 --
    # o transaction pooler (6543) nao serve para `prisma migrate deploy`,
    # porque DDL e prepared statements nao sobrevivem a pooling por transacao.
    #
    # ATENCAO A REGIAO: medido do no do AKS, o pooler sa-east-1 responde em
    # ~150ms contra ~40ms do us-east-1. Sao ~110ms a mais por ida e volta, que
    # numa requisicao com varias queries multiplica. Ver apps/zisp/README.md.
    name: zisp-api-env

ingress:
  enabled: true
  host: api.zisp.com.br
  ingressClassName: traefik
  clusterIssuer: letsencrypt-prod

# Fecha o buraco das migrations que nunca chegaram em producao: se o
# `prisma migrate deploy` falhar, o helm upgrade falha e o pod velho continua
# servindo, em vez de subir codigo novo contra schema velho.
migration:
  enabled: true
  command: ["npx", "prisma", "migrate", "deploy"]
