# zisp-super-api (era `super-api` no Flux do zisp-k8s).
# Painel super + CRM de prospeccao + agente BDR. Sem Prisma: DynamoDB.
nameOverride: zisp-super-api

image:
  repository: ""
  tag: ""

containerPort: 3050
portEnvName: PORT

# Recreate, e nao e por causa de volume: as sessoes WhatsApp (Baileys) rodam
# DENTRO deste processo. Dois pods = dois sockets com as mesmas credenciais
# de sessao = o WhatsApp derruba a conexao.
#
# No Flux antigo o aviso estava no comentario mas `strategy` nao estava
# definida, entao herdava RollingUpdate e em todo deploy havia ~30s com dois
# pods abrindo Baileys na sessao `zisp-super`. Candidata plausivel ao ban do
# numero em 28/09/2026.
replicas: 1
strategy:
  type: Recreate

resources:
  requests:
    cpu: 80m
    # Baileys (socket + libsignal) + workers BullMQ no mesmo pod.
    memory: 240Mi
  limits:
    cpu: 250m
    memory: 400Mi

# NAO LIGAR. Mesmo motivo do Recreate acima: replica > 1 derruba a sessao.
autoscaling:
  enabled: false

probes:
  enabled: true
  path: /health
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# SEM pinning: esta release nao toca host nem volume, so Redis por Service.
# Cabe nos nos do pool `system` que ja existem, logo nao espera quota.

env:
  configMap:
    enabled: true
    data:
      NODE_ENV: "production"
      DYNAMODB_LEADS_TABLE: "zisp-chatbot-leads"
      DYNAMODB_USERS_TABLE: "zisp-super-users"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "30d"
      AWS_REGION: "us-east-1"
      CORS_ORIGINS: "https://super.zisp.com.br"
      SES_FROM_EMAIL: "contato@zisp.com.br"
      # PREREQUISITO: o Redis do ZISP ainda nao existe neste cluster. Nome
      # curto: mesmo namespace.
      REDIS_URL: "redis://redis-bullmq-svc:6379"
      WHATSAPP_SESSION_ID: "zisp-super"
      # Rate-limit zerado de proposito (decisao 2026-09-09): ambiente
      # controlado. ANTES havia 45000/24 explicitos aqui, que sobrescreviam o
      # default 0 do codigo e deixavam o rate-limit ativo sem ninguem notar.
      LEADS_MIN_SEND_INTERVAL_MS: "0"
      LEADS_BATCH_COOLDOWN_HOURS: "0"
      # DESLIGADO em 28/09/2026 apos o ban do numero `zisp-super` (403 em
      # loop). NAO religar sem (1) numero novo conectado e (2) ritmo revisado.
      BDR_AUTONOMOUS_ENABLED: "false"
  secret:
    enabled: true
    name: zisp-super-api-env

ingress:
  enabled: true
  # super.zisp.com.br e o painel na Netlify; a API fica no -api.
  host: super-api.zisp.com.br
  ingressClassName: traefik
  clusterIssuer: letsencrypt-prod

# Sem Prisma, sem schema: nao ha migracao. O workflow le este campo e so
# liga o Job de pre-upgrade para quem o declara -- forcar true aqui daria
# fail no chart, que exige migration.command quando enabled.
migration:
  enabled: false
