{{- range .Values.releases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  dataFrom:
    # extract: o valor do segredo no Key Vault e um objeto JSON, e cada
    # chave dele vira uma chave do Secret. Uma variavel nova de ambiente
    # e uma edicao no Key Vault, sem tocar git nem CI.
    - extract:
        key: {{ .keyVaultSecret | quote }}
{{- end }}
