name: Deploy Simplaca with Helm

on:
  workflow_call:
    inputs:
      image_sha:
        required: true
        type: string
      acr_name:
        required: true
        type: string
      azure_client_id:
        required: true
        type: string
      azure_tenant_id:
        required: true
        type: string
      azure_subscription_id:
        required: true
        type: string
    secrets:
      NODE_ENV:
        required: true
      PORT:
        required: true
      PLACAS_API_BASE_URL:
        required: true
      REPORT_PRICE_CENTS:
        required: true
      SMTP_HOST:
        required: true
      SMTP_PORT:
        required: true
      FROM_EMAIL:
        required: true
      FROM_NAME:
        required: true
      BLOG_ADMIN_EMAIL:
        required: true
      DATABASE_URL:
        required: true
      PLACAS_API_TOKEN:
        required: true
      IUGU_API_TOKEN:
        required: true
      IUGU_WEBHOOK_SECRET:
        required: true
      SMTP_USERNAME:
        required: true
      SMTP_PASSWORD:
        required: true
      BLOG_ADMIN_PASSWORD:
        required: true
      BLOG_ADMIN_SECRET:
        required: true
      JWT_SECRET:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      ACR_NAME: ${{ inputs.acr_name }}
      IMAGE_SHA: ${{ inputs.image_sha }}
      DEPLOY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate image SHA
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'image_sha must be a full lowercase commit SHA' >&2
            exit 1
          fi
      - name: Check out infrastructure
        uses: actions/checkout@v4
        with:
          repository: clemeson/byteflip-infra
          ref: main
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/use-kubelogin@v1
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Isolate kubeconfig on the runner
        run: echo "KUBECONFIG=$RUNNER_TEMP/simplaca-aks-kubeconfig" >> "$GITHUB_ENV"
      - name: Configure AKS and verify image
        run: |
          : "${ACR_NAME:?Set ACR_NAME in repository variables}"
          az aks get-credentials --resource-group personal-aks-eastus2-prod \
            --name personal-prod --file "$KUBECONFIG" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          test "$(kubectl config current-context)" = personal-prod
          az acr repository show-tags --name "$ACR_NAME" \
            --repository simplaca-api --output tsv | grep -Fx -- "$IMAGE_SHA" >/dev/null
      - name: Update application Secret
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          PLACAS_API_BASE_URL: ${{ secrets.PLACAS_API_BASE_URL }}
          REPORT_PRICE_CENTS: ${{ secrets.REPORT_PRICE_CENTS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          BLOG_ADMIN_EMAIL: ${{ secrets.BLOG_ADMIN_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLACAS_API_TOKEN: ${{ secrets.PLACAS_API_TOKEN }}
          IUGU_API_TOKEN: ${{ secrets.IUGU_API_TOKEN }}
          IUGU_WEBHOOK_SECRET: ${{ secrets.IUGU_WEBHOOK_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BLOG_ADMIN_PASSWORD: ${{ secrets.BLOG_ADMIN_PASSWORD }}
          BLOG_ADMIN_SECRET: ${{ secrets.BLOG_ADMIN_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python3 scripts/sync-simplaca-secret.py
      - name: Deploy immutable image
        run: |
          ./scripts/deploy-app.sh simplaca api \
            "$ACR_NAME.azurecr.io/simplaca-api" "$IMAGE_SHA"
      - name: Record release
        run: echo "Simplaca AKS image $ACR_NAME.azurecr.io/simplaca-api:$IMAGE_SHA" >> "$GITHUB_STEP_SUMMARY"
