name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Terraform format
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform (no deployment)
        run: |
          for dir in terraform/aks/prod terraform/cluster/prod; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      # Checagens que o helm nao faz: o manifesto aponta para arquivos e
      # nomes que precisam existir e casar. Errar aqui so apareceria no
      # deploy, com o release pela metade.
      - name: Validate apps/releases.yaml
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          releases = yaml.safe_load(open("apps/releases.yaml"))["releases"]
          errors, seen = [], set()
          for r in releases:
              name = r["release"]
              if name in seen:
                  errors.append(f"{name}: release duplicada")
              seen.add(name)
              values = pathlib.Path(r["values"])
              if not values.is_file():
                  errors.append(f"{name}: values {values} nao existe")
                  continue
              v = yaml.safe_load(values.read_text())
              if v.get("nameOverride") != name:
                  errors.append(
                      f"{name}: nameOverride do values e {v.get('nameOverride')!r}. "
                      "Divergir renomearia Deployment e Service sem o release mudar."
                  )
              secret = ((v.get("env") or {}).get("secret") or {})
              declared = secret.get("name") or f"{name}-env"
              if secret.get("enabled") and declared != r["keyVaultSecret"]:
                  errors.append(
                      f"{name}: env.secret.name={declared} != keyVaultSecret={r['keyVaultSecret']}. "
                      "O ExternalSecret criaria um Secret com outro nome e o pod ficaria sem env."
                  )
              mig = v.get("migration") or {}
              if mig.get("enabled") and not mig.get("command"):
                  errors.append(f"{name}: migration.enabled sem migration.command")
          if errors:
              print("\n".join(f"::error::{e}" for e in errors))
              sys.exit(1)
          print(f"{len(releases)} releases coerentes")
          PY
      - name: Render charts
        run: |
          # Toda release do manifesto, nao so a primeira: os values do zisp
          # passariam sem checagem se este passo ficasse fixo no simplaca.
          releases=$(python3 -c 'import json,yaml,sys; json.dump(yaml.safe_load(open("apps/releases.yaml"))["releases"], sys.stdout)')
          echo "$releases" | jq -c '.[]' | while read -r r; do
            release=$(jq -r .release <<<"$r")
            namespace=$(jq -r .namespace <<<"$r")
            values=$(jq -r .values <<<"$r")
            echo "--- $release"
            # migration ligada de proposito: cobre tambem o Job, que sem isso
            # nunca seria renderizado no CI.
            migrate=$(python3 -c 'import yaml,sys; print(str(bool((yaml.safe_load(open(sys.argv[1])).get("migration") or {}).get("enabled"))).lower())' "$values")
            # helm lint recebe CAMINHO, nao nome de release; helm template
            # recebe os dois. Por isso os dois comandos sao escritos separados
            # em vez de num laco.
            common=(
              --namespace "$namespace"
              --values "$values"
              --set "migration.enabled=$migrate"
              --set-string image.repository=example.azurecr.io/"$release"
              --set-string image.tag=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            )
            helm lint charts/app "${common[@]}"
            helm template "$release" charts/app "${common[@]}" >/dev/null
          done
          # O chart do vpn-server nao esta em releases.yaml: ele nao usa
          # charts/app e tem ciclo proprio. Renderizado a parte.
          helm lint charts/vpn-server \
            --set-string image.repository=example.azurecr.io/vpn-server \
            --set-string image.tag=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string service.loadBalancerIP=203.0.113.10 \
            --set-string service.loadBalancerResourceGroup=example-rg
          helm template vpn-server charts/vpn-server --namespace zisp \
            --set-string image.repository=example.azurecr.io/vpn-server \
            --set-string image.tag=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string service.loadBalancerIP=203.0.113.10 \
            --set-string service.loadBalancerResourceGroup=example-rg >/dev/null
          # Sem imagem o chart tem de falhar, nao renderizar ":".
          if helm template vpn-server charts/vpn-server >/dev/null 2>&1; then
            echo 'vpn-server rendered without an image' >&2
            exit 1
          fi
          # O entrypoint e shell e vai para dentro da imagem: sintaxe quebrada
          # so apareceria como CrashLoopBackOff em producao.
          bash -n images/vpn-server/entrypoint.sh
          python3 -m py_compile images/vpn-server/zisp-ppp-connections.py
          helm template app-secrets charts/app-secrets \
            --set keyVault.url=https://example.vault.azure.net \
            --set keyVault.tenantId=00000000-0000-0000-0000-000000000000 >/dev/null
          helm template cluster-issuers charts/cluster-issuers \
            --set acme.email=ci@example.com >/dev/null
          # Sem e-mail o ClusterIssuer tem de falhar.
          if helm template cluster-issuers charts/cluster-issuers >/dev/null 2>&1; then
            echo 'ClusterIssuer rendered without acme.email' >&2
            exit 1
          fi
