name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Terraform format
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform (no deployment)
        run: |
          for dir in terraform/aks/prod terraform/cluster/prod; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Render charts
        run: |
          helm lint charts/app \
            --values apps/simplaca/api/values-prod.yaml \
            --set-string image.repository=example.azurecr.io/simplaca-api \
            --set-string image.tag=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template simplaca-api charts/app \
            --namespace simplaca \
            --values apps/simplaca/api/values-prod.yaml \
            --set-string image.repository=example.azurecr.io/simplaca-api \
            --set-string image.tag=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa >/dev/null
          helm template app-secrets charts/app-secrets \
            --set keyVault.url=https://example.vault.azure.net \
            --set keyVault.tenantId=00000000-0000-0000-0000-000000000000 >/dev/null
          helm template cluster-issuers charts/cluster-issuers \
            --set acme.email=ci@example.com >/dev/null
          # Sem e-mail o ClusterIssuer tem de falhar.
          if helm template cluster-issuers charts/cluster-issuers >/dev/null 2>&1; then
            echo 'ClusterIssuer rendered without acme.email' >&2
            exit 1
          fi
